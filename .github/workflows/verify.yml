name: Verify lessons

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: gofmt
        run: |
          unformatted=$(gofmt -l tools lessons starter starter.sv starter.en starter.ja)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - name: go vet (course tool)
        working-directory: tools/mudschool
        run: go vet ./...

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .verify-target
          key: cargo-${{ hashFiles('**/Cargo.toml') }}-${{ github.run_id }}
          restore-keys: |
            cargo-${{ hashFiles('**/Cargo.toml') }}-
            cargo-
      - name: All lessons, all languages
        run: ./mudschool verify
