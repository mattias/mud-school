name: Verifiera lektioner

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            .verify-target
          key: cargo-${{ hashFiles('lessons/**/Cargo.toml') }}
      - name: Kursverktyget
        working-directory: tools/mudschool
        run: go vet ./...
      - name: Alla lektioner
        run: ./mudschool verify
